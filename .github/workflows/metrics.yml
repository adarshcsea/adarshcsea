name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT }}  # <--- Put your PAT secret here
          filename: github-metrics.svg
          base: ""
          plugin_prs: yes
          plugin_prs_sections: merged

